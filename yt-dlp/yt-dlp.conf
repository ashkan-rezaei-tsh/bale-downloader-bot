# ==============================================================================
# YT-DLP CONFIGURATION FILE (COOKIES & JAVASCRIPT RUNTIMES)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. COOKIE SETTINGS
# ------------------------------------------------------------------------------
# Option A: Extract cookies dynamically from your primary browser (Recommended)
# Supported: chrome, firefox, edge, brave, opera, vivaldi, safari
--cookies ./cookies.txt

# Option B: Path to a specific Netscape/Mozilla formatted cookies text file
# (Uncomment the line below if you prefer a static text file instead of Option A)
# --cookies "/path/to/your/cookies.txt"


# ------------------------------------------------------------------------------
# 2. JAVASCRIPT RUNTIME SETTINGS (Required for YouTube EJS/Challenge Solvers)
# ------------------------------------------------------------------------------
# Clear any prior/default JS runtime configurations first
--no-js-runtimes

# Specify your preferred JS runtimes in order of priority (Highest to Lowest).
# The binary version checks the PATH env variable for these unless a absolute path is provided.
# Formats: RUNTIME or RUNTIME:PATH_TO_BINARY
--js-runtimes deno
--js-runtimes node

# Allow yt-dlp to automatically fetch missing remote interpreter components (e.g., for EJS)
--remote-components ejs:github
